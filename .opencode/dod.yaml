        перед правкой. Наблюдалось 06.10 на .opencode/dod.yaml и .opencode/doc_check.py и
        повторно 07.10: правка блока docs в main не нашлась после форматирования.
      since: "2026-10-06"
    - what: >-
        ЯКОРЬ В output_summary ТРЕБУЕТ ВИДА ПУТЬ:СТРОКА. Регулярка dod-check ищет
        ([\w./-]+\.[A-Za-z0-9]+)(:[0-9]+|#...), поэтому «Строка 114 packages/core/src/instance.ts
        содержит» якоря не даёт, а «packages/core/src/instance.ts:114 содержит» даёт. Плюс
        слова «написан», «написано», «ок», «должно» считаются расплывчатыми в любом регистре
        и в любом месте текста. Обе проверки срабатывают даже внутри честного пересказа вывода.
      since: "2026-10-07"
    - what: >-
        TARGET ЛИСТА ОБЯЗАН СУЩЕСТВОВАТЬ НА ДИСКЕ ДАЖЕ ПРИ task_state NOT_STARTED: dod-check
        ругается «путь не существует». Для неначатого листа target ставится на существующий
        файл-основание (манифест), а создаваемые файлы перечисляются в what и steps.
      since: "2026-10-07"
    - what: >-
        ДЫРА В ОРАКУЛЕ СИМВОЛОВ БЫЛА ДВОЙНОЙ. Первая: check_sample делал continue для пакета без
        src и пропускал его целиком, а фикстура с выдуманным символом давала код 0. Вторая, моя
        же: после исправления «нет src — всегда нарушение» оракул покраснел на packages/storybook,
        у которого src нет и в манифесте честно 0 строк. Правильное условие: нет src при
        ненулевом числе строк в манифесте — нарушение; ноль строк — сверять нечего, и это не дефект.
      since: "2026-10-07"
    - what: >-
        КЛАСС СИМВОЛОВ В РЕГУЛЯРКЕ ЗАГОЛОВКА ДОЛЖЕН ВКЛЮЧАТЬ ЦИФРЫ. Было [a-z-], и папка core/v1
        давала ложное нарушение «первая строка не заголовок», хотя документ был верен. Проверено:
        такие ложные срабатывания выглядят как дефект документа и вводят в заблуждение.
      since: "2026-10-07"
    - what: >-
        В дереве три изменённых файла: packages/script/src/index.ts,
        packages/tui/src/component/session-tabs.tsx, packages/tui/src/context/storage.tsx.
        Это правки прошлой работы лида по пульту oc-hub, не TASK-DOC-CORE. Пока они не
        закоммичены, git status в репозитории не будет чистым — это не дефект документации.
      since: "2026-10-06"
    - what: >-
        Репозиторий в ОТСОЕДИНЕННОЙ ГОЛОВЕ (detached HEAD) на теге v2.0.22. Коммит невозможен
        без указания ветки или тега; push запрещён правилом permissions. Документы остаются
        рабочими файлами в дереве, попадут в чужой git как untracked.
      since: "2026-10-06"
    - what: >-
        Слои зависимостей прочитаны из полей dependencies в packages/*/package.json, а не из
        графа импортов. Реальная связность может отличаться (например tui/src/mini тянет core
        напрямую, минуя context/client.tsx). Это помечено как приближение в ARCHITECTURE.md.
      since: "2026-10-06"
    - what: >-
        Валидатор проверяет форму документа и существование путей, но НЕ проверяет, что
        написанное совпадает со смыслом кода. Фактическую верность описания подтверждает
        только чтение исходников автором документа и выборочная проверка O-DOC-REALITY.
      since: "2026-10-06"
  ask:
    - question: "Имя файла PACKAGE.md выбрал лид (владелец его не выбирал). 14 пакетов уже имеют README.md, поэтому переименовывать их не стали. Если нужно другое имя — переименуем до того, как файлов станет много."
