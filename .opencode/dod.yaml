oracles:
  - id: O-DOC
    command: "python3 .opencode/doc_check.py && python3 .opencode/doc_check.py --links"
    oracle_scope:
      detects:
        - "пакет из манифеста остался без PACKAGE.md"
        - "PACKAGE.md пустой или короче 20 строк — ИИ ничего не поймёт"
        - "в PACKAGE.md нет обязательных разделов (что это / подсистемы / точки входа / на что смотреть)"
        - "в документе осталась заглушка: TODO, FIXME, 'раскрыть позже', Lorem"
        - "документ ссылается на путь packages/..., которого нет на диске (файл переехал или выдуман)"
        - "документ ссылается на каталог, которого нет (опечатка в пути)"
        - "у документа нет ссылки на соседние документы — ИИ не знает, куда идти дальше"
      misses:
        - "фактическую верность описания: валидатор проверяет форму и существование путей, но не то, что написанное совпадает со смыслом кода"
        - "полноту описания подсистем: наличие обязательных разделов не значит, что каждая подсистема пакета описана"
        - "дублирование и противоречия между документами разных пакетов"
        - "читаемость текста для ИИ: это свойство текста, а не файла"
    command_status: VERIFIED_CMD
    validated_at: "2026-10-06"
    expires_at: "2026-12-31"
    negative_control:
      method: FIXTURE
      target: "копия пакета util и манифеста во временном каталоге /tmp/opencode/docneg.XXXXXX, четыре отдельные мутации по очереди"
      expected_failure: "каждая мутация даёт ненулевой код и печатает СВОЮ причину: пустой документ, отсутствующий раздел «Точки входа», битая ссылка packages/util/src/nope.ts, заглушка TODO"
      executed: true
      exit_code: 1
      target_is_fixture: true
      summary: >-
        06.10 bash .opencode/doc_check.sh util → строка «ИТОГ: все 4 мутации пойманы, чистая копия прошла» файла .opencode/doc_check.sh.
        Первый прогон был ЛОЖНО ЗЕЛЁНЫМ: все 4 мутации прошли незамеченными, потому что
        валидатор выводил корень из пути к себе и читал живой репозиторий. Причина найдена и
        устранена (флаг --root), после этого поймано по своей причине:
        «PACKAGE.md короче 20 строк (0)», «нет обязательного раздела «Точки входа»»,
        «путь не существует — packages/util/src/nope.ts», «заглушка «TODO»»

  - id: O-DOC-REALITY
    command: "cd /home/isako/opencode-src && python3 .opencode/doc_check.py --sample"
    oracle_scope:
      detects:
        - "в документе назван символ (функция, класс, константа), которого нет в исходниках пакета — выдумка автора вместо чтения кода"
        - "в документе назван файл, который существует, но лежит не в том пакете, о котором документ"
        - "цифра в документе (число строк, число файлов, число провайдеров) не сходится с реальным подсчётом"
      misses:
        - "верность объяснения логики кода: символ существует, но описано не то, что он делает"
        - "полноту: не проверяет, что описаны все важные подсистемы пакета"
        - "устаревание: проверка идёт по текущему дереву и не ловит, что текст писался про старую ревизию"
    command_status: VERIFIED_CMD
    validated_at: "2026-10-06"
    expires_at: "2026-12-31"
    negative_control:
      method: FIXTURE
      target: "временная копия packages/core (PACKAGE.md плюс src/session.ts) и манифест из одной строки; в документ дописан выдуманный символ core.madeUpFunctionInCore"
      expected_failure: "--sample печатает 'символ не найден в исходниках core' и выходит с кодом 1"
      executed: true
      exit_code: 1
      target_is_fixture: true
      summary: >-
        06.10 прогон на копии дал ровно «ПРОБЛЕМА  core: символ не найден в исходниках core —
        core.madeUpFunctionInCore», код 1. Первая попытка фикстуры была ЛОЖНО ЗЕЛЁНОЙ: копия
        пакета без каталога src, а check_sample делал continue и пропускал пакет целиком.
        Причина найдена и устранена: пакет без packages/<pkg>/src теперь даёт нарушение
        «сверять символы нечем», а не молчаливый проход. После правки та же фикстура без src
        даёт «ПРОБЛЕМА  schema: нет packages/schema/src — сверять символы нечем».

  - id: O-CORE-DOCS
    command: "python3 .opencode/check_core_docs.py"
    oracle_scope:
      detects:
        - "в packages/core/docs/ нет файла для любой папки packages/core/src/* — список берётся из дерева, а не из захардкоженного (на 07.10 это 39 папок: 38 каталогов src плюс тема models-dev)"
        - "файл пустой или короче 20 строк — ИИ открыть нечего"
        - "нет первого заголовка вида '# core/<папка> — назначение'"
